name: docker

# main → ghcr.io/awpsec/recast:edge · tag vX.Y.Z → :X.Y.Z, :X.Y and :latest (what compose.yaml pulls)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64) for a smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: recast:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eux
          docker run --rm --entrypoint ffmpeg recast:test -hide_banner -encoders | grep -E "hevc_(qsv|vaapi|nvenc)"
          mkdir -p lib/Show/Season\ 1
          docker run --rm --entrypoint ffmpeg -v "$PWD/lib:/tv" recast:test -v error -f lavfi -i testsrc2=duration=3:size=640x360 \
            -c:v libx264 "/tv/Show/Season 1/Show - S01E01.mkv"
          docker run -d --name smoke -p 8484:8484 -e RECAST_LIBRARIES=/tv -v "$PWD/lib:/tv" recast:test
          for i in $(seq 60); do
            curl -fs localhost:8484/api/health | grep -q '"setup": true' && break
            sleep 2
          done
          curl -fs localhost:8484/api/health
          curl -fs localhost:8484/api/state | grep -q '"needs_setup": false'
          docker logs smoke
          docker rm -f smoke

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
