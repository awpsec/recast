[project]
name = "recast"
version = "0.1.0"
description = "TUI for re-encoding a Plex/Sonarr/Radarr library with ffmpeg: preview one file, approve, replace."
requires-python = ">=3.10"
dependencies = ["textual[syntax]>=8.0", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "textual-serve>=1.1"]

[project.scripts]
recast = "recast.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recast"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
