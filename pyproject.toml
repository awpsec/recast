[project]
name = "recast"
version = "0.1.0"
description = "Re-encode a Plex/Sonarr/Radarr library with ffmpeg: terminal app, web app, and paced automation that only replaces clear wins."
requires-python = ">=3.10"
dependencies = ["textual[syntax]>=8.0", "pillow>=10", "aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-aiohttp>=1.0", "textual-serve>=1.1"]

[project.scripts]
recast = "recast.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recast"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
